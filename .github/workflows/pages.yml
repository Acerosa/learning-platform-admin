name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out administration portal
        uses: actions/checkout@v7
        with:
          path: learning-platform-admin

      - name: Read shared dependency pins
        id: siblings
        working-directory: learning-platform-admin
        run: node scripts/bootstrap-siblings.mjs --github-output

      - name: Check out shared platform core
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.core_repository }}
          ref: ${{ steps.siblings.outputs.core_ref }}
          path: learning-platform-core

      - name: Check out shared curriculum content engine
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.content_repository }}
          ref: ${{ steps.siblings.outputs.content_ref }}
          path: learning-platform-content

      - name: Check out shared results package
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.results_repository }}
          ref: ${{ steps.siblings.outputs.results_ref }}
          path: learning-platform-results

      - name: Verify shared dependency pins
        working-directory: learning-platform-admin
        run: node scripts/bootstrap-siblings.mjs --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.siblings.outputs.node_version }}
          cache: npm
          cache-dependency-path: learning-platform-admin/package-lock.json

      - name: Install dependencies
        working-directory: learning-platform-admin
        run: npm ci

      - name: Typecheck
        working-directory: learning-platform-admin
        run: npm run typecheck

      - name: Integration tests
        working-directory: learning-platform-admin
        run: npm run test:integration

      - name: Build server bundle
        working-directory: learning-platform-admin
        run: npm run build

      - name: Route tests
        working-directory: learning-platform-admin
        run: node --test tests/*.test.mjs

      - name: Authoring tests
        working-directory: learning-platform-admin
        run: npm run test:authoring

      - name: Lint
        working-directory: learning-platform-admin
        run: npm run lint

      - name: Build static dashboard
        working-directory: learning-platform-admin
        run: npm run build:pages

  build:
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out administration portal
        uses: actions/checkout@v7
        with:
          path: learning-platform-admin

      - name: Read shared dependency pins
        id: siblings
        working-directory: learning-platform-admin
        run: node scripts/bootstrap-siblings.mjs --github-output

      - name: Check out shared platform core
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.core_repository }}
          ref: ${{ steps.siblings.outputs.core_ref }}
          path: learning-platform-core

      - name: Check out shared curriculum content engine
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.content_repository }}
          ref: ${{ steps.siblings.outputs.content_ref }}
          path: learning-platform-content

      - name: Check out shared results package
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.siblings.outputs.results_repository }}
          ref: ${{ steps.siblings.outputs.results_ref }}
          path: learning-platform-results

      - name: Verify shared dependency pins
        working-directory: learning-platform-admin
        run: node scripts/bootstrap-siblings.mjs --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.siblings.outputs.node_version }}
          cache: npm
          cache-dependency-path: learning-platform-admin/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: learning-platform-admin
        run: npm ci

      - name: Build static dashboard
        working-directory: learning-platform-admin
        env:
          NEXT_PUBLIC_ADMIN_DATA_MODE: ${{ vars.ADMIN_DATA_MODE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:pages

      - name: Disable Jekyll processing
        run: touch learning-platform-admin/dist/pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: learning-platform-admin/dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success() }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
